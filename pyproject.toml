[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[toml]>=8.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "uvex_imager_etc"
description = "Repository for the UVEX imager ETC."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT License" }
authors = [
  { name = "Hannah Earnshaw", email = "hpearn@caltech.edu" },
]
dependencies = [
"numpy",
"astropy",
"synphot",
"scipy",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-doctestplus",
    "pytest-cov",
]
docs = [
    "sphinx",
    "sphinx-automodapi",
]

[project.urls]
Homepage = "https://github.com/uvex-mission/uvex-imager-etc"

[project.scripts]
install_uvex_etc_caldb = "uvex_imager_etc.uvex:install_uvex_etc_caldb"
list_installed_uvex_etc_caldbs = "uvex_imager_etc.uvex:list_installed_caldbs"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # The package already suppresses Erfa's future date warnings
    # at import time in __init__.py, but pytest's own warning-capture
    # context can override that per-test, so it's suppressed here too
    # for reliability.
    "ignore::erfa.ErfaWarning",
]
 
